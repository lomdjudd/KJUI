name: Mod Minecraft (NeoForge 1.21.1)

on:
  push:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/minecraft-mod.yml'
  pull_request:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/minecraft-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Versions NeoForge 1.21.1 disponibles
        run: curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '21\.1\.[0-9]+' | sort -t. -k3 -n | uniq | tail -5

      - name: Compiler le mod
        run: ./gradlew build --stacktrace

      - name: Envoyer le .jar
        uses: actions/upload-artifact@v4
        with:
          name: hulkironman-neoforge-1.21.1
          path: minecraft-mod/build/libs/*.jar
          if-no-files-found: error
