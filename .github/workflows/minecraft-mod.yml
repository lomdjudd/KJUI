name: Mod Minecraft (NeoForge 1.21.1)

on:
  push:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/minecraft-mod.yml'
  pull_request:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/minecraft-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler le mod
        run: |
          set +e
          ./gradlew build --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "----- erreurs de compilation -----"
          grep -E "error:|warning: \[removal\]" -A3 build.log | head -200
          exit $status

      - name: Auto-test sur un vrai serveur (pouvoirs + Galactus)
        run: |
          mkdir -p run-selftest
          echo "eula=true" > run-selftest/eula.txt
          cat > run-selftest/server.properties <<'PROPS'
          online-mode=false
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          difficulty=normal
          view-distance=4
          simulation-distance=4
          max-tick-time=-1
          PROPS
          (timeout 900 ./gradlew runSelfTest --stacktrace || true) 2>&1 | tee selftest.log
          echo "----- résumé -----"
          grep -E "\[SELFTEST\]" selftest.log || true
          grep -q "\[SELFTEST\] OK" selftest.log

      - name: Envoyer le .jar
        uses: actions/upload-artifact@v4
        with:
          name: hulkironman-neoforge-1.21.1
          path: minecraft-mod/build/libs/*.jar
          if-no-files-found: error
