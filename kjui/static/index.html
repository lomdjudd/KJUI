<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KJUI Brain</title>
<style>
:root{
  --tx:#1a2133;--mut:#6a7590;--line:rgba(255,255,255,.75);--edge:rgba(120,145,185,.28);
  --c-mem:#0096e6;--c-ins:#ff961e;--c-con:#8c5af0;--c-fil:#1ebe78;--c-img:#f0508c;--ok:#0a9b64;
  --glass:linear-gradient(160deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.38) 55%,rgba(235,243,255,.5) 100%);
  --rim:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 6px rgba(130,160,205,.28),inset 1px 0 2px rgba(255,255,255,.6),inset -1px 0 2px rgba(255,255,255,.6);
  --drop:0 10px 30px rgba(40,65,110,.13),0 2px 6px rgba(40,65,110,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tx);overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#f4f7fc 55%,#e9eff8 100%);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* nappes de couleur floues derrière le verre */
.blobs i{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:#a7dcff}
.blobs i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:20vh;background:#e2cfff;animation-delay:-8s}
.blobs i:nth-child(3){width:36vw;height:36vw;left:25vw;bottom:-16vw;background:#ffd3e6;animation-delay:-14s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.15)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.drag{cursor:grabbing}canvas.hov{cursor:pointer}
/* verre liquide */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--rim),var(--drop);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%)}
.glass::before{content:"";position:absolute;left:8%;right:8%;top:1px;height:38%;border-radius:22px 22px 60% 60%/22px 22px 100% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
#top{position:fixed;left:18px;right:18px;top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
#logo{font-weight:650;letter-spacing:.04em;font-size:15px;padding:10px 18px;display:flex;gap:10px;align-items:center;border-radius:999px}
.bead{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#9fe0ff 28%,#0096e6 70%,#005e99 100%);box-shadow:0 3px 6px rgba(0,80,140,.35),inset 0 -2px 3px rgba(0,60,110,.3)}
#search{flex:1;min-width:220px;max-width:520px;display:flex;align-items:center;padding:0 16px;gap:10px;border-radius:999px}
#search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:12px 0;position:relative}
#search input::placeholder{color:#8b96b0}
#search span{color:#8b96b0;position:relative}
/* boutons pilule */
.btn{position:relative;display:inline-block;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(232,240,252,.7));
  border:1px solid rgba(255,255,255,.9);color:var(--tx);padding:10px 18px;border-radius:999px;font:inherit;font-weight:550;cursor:pointer;
  box-shadow:var(--rim),0 6px 16px rgba(40,65,110,.16);transition:transform .15s,box-shadow .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--rim),0 10px 22px rgba(40,65,110,.22)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.dark{background:linear-gradient(180deg,#2b3450,#10162a);color:#fff;border-color:rgba(255,255,255,.25);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.3),0 8px 18px rgba(16,22,42,.35)}
.btn.warn{color:#c23a4b}
/* interrupteur */
.switch{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:12.5px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch b{position:relative;width:42px;height:24px;border-radius:99px;background:linear-gradient(180deg,#dfe6f2,#eef2f9);box-shadow:inset 0 2px 4px rgba(90,110,150,.3),0 1px 0 #fff;transition:.25s;flex:none}
.switch b::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8eef8);box-shadow:0 2px 5px rgba(40,65,110,.35);transition:.25s}
.switch input:checked+b{background:linear-gradient(180deg,#0a84e8,#4fb4ff)}
.switch input:checked+b::after{transform:translateX(18px)}
#top .switch{padding:10px 16px;border-radius:999px}
#top .switch span,#top .switch b{position:relative}
#stats{position:fixed;left:18px;bottom:18px;display:flex;gap:12px;flex-wrap:wrap;z-index:3}
.tile{padding:12px 18px;min-width:118px}
.tile b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;position:relative}
.tile span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;position:relative}
.tile.sv b{color:var(--ok)}
.bar{margin-top:8px;height:6px;border-radius:9px;background:rgba(120,140,175,.2);box-shadow:inset 0 1px 2px rgba(90,110,150,.25);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#10162a,#2b3450);transition:width .8s cubic-bezier(.2,.8,.2,1)}
#legend{position:fixed;right:18px;bottom:18px;padding:12px 18px;display:flex;gap:16px;font-size:12px;color:var(--mut);flex-wrap:wrap;border-radius:999px;z-index:3}
#legend span{position:relative}
#legend i,.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:radial-gradient(circle at 32% 28%,#fff 0,currentColor 60%);box-shadow:0 2px 4px rgba(40,65,110,.3);vertical-align:-1px}
.dot{margin:0;flex:none}
#side{position:fixed;right:18px;top:78px;bottom:82px;width:min(410px,calc(100vw - 36px));padding:20px;overflow:auto;transform:translateX(125%);transition:transform .45s cubic-bezier(.2,.9,.2,1);z-index:4}
#side.open{transform:none}
#side>*{position:relative}
#side h2{margin:0 0 6px;font-size:17px;font-weight:650}
#side .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.badge{font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 -1px 2px rgba(120,145,185,.2);color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.5);border-radius:14px;padding:12px;margin:10px 0;
  font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;max-height:42vh;overflow:auto;box-shadow:inset 0 2px 5px rgba(90,110,150,.18),0 1px 0 #fff;color:#2a3450}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;cursor:pointer;transition:.15s}
.res:hover{background:rgba(255,255,255,.7);box-shadow:var(--rim)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
#tip{position:fixed;pointer-events:none;padding:7px 14px;border-radius:99px;font-size:12px;max-width:300px;opacity:0;transition:opacity .12s;z-index:6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:rgba(220,230,245,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10}
#modal.open{display:flex}
#modal .box{width:min(520px,92vw);padding:24px}
#modal .box>*{position:relative}
#modal label{font-size:12px;color:var(--mut);font-weight:550}
#modal input:not([type=checkbox]),#modal textarea,#modal select{display:block;width:100%;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:14px;color:var(--tx);font:inherit;padding:11px 14px;margin:6px 0 14px;outline:0;box-shadow:inset 0 2px 5px rgba(90,110,150,.2)}
#modal input:focus,#modal textarea:focus,#modal select:focus{box-shadow:inset 0 2px 5px rgba(90,110,150,.2),0 0 0 3px rgba(10,132,232,.28)}
#modal textarea{min-height:130px;resize:vertical}
#drop{position:fixed;inset:14px;border:2px dashed #0a84e8;border-radius:32px;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#0a6ec4;background:rgba(160,210,255,.25);backdrop-filter:blur(4px);z-index:9;pointer-events:none}
#empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--mut);pointer-events:none;display:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);padding:11px 22px;border-radius:999px;opacity:0;transition:.3s;z-index:12}
#side::-webkit-scrollbar,pre::-webkit-scrollbar{width:8px}
#side::-webkit-scrollbar-thumb,pre::-webkit-scrollbar-thumb{background:rgba(120,145,185,.35);border-radius:9px}
code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:7px}
@media(max-width:640px){.tile{min-width:92px;padding:9px 12px}#legend{display:none}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>
<canvas id="c"></canvas>
<div id="top">
  <div id="logo" class="glass"><span class="bead"></span><span style="position:relative">KJUI Brain</span></div>
  <div id="search" class="glass"><span>⌕</span><input id="q" placeholder="Interroger le cerveau…  (Entrée = rappel complet)" autocomplete="off"></div>
  <button class="btn dark" id="add">+ Souvenir</button>
  <label class="btn">⬆ Fichiers / images<input id="file" type="file" multiple hidden></label>
  <label class="switch glass"><input type="checkbox" id="asInstr"><b></b><span>instructions épinglées</span></label>
</div>
<div id="stats">
  <div class="tile glass"><b id="s-n">0</b><span>souvenirs</span></div>
  <div class="tile glass"><b id="s-t">0</b><span>tokens stockés</span></div>
  <div class="tile glass"><b id="s-r">0</b><span>rappels</span></div>
  <div class="tile glass sv"><b id="s-s">0</b><span>tokens économisés (est.)</span><div class="bar"><i id="s-bar"></i></div></div>
</div>
<div id="legend" class="glass">
  <span><i style="color:var(--c-mem)"></i>souvenir</span><span><i style="color:var(--c-ins)"></i>instruction</span>
  <span><i style="color:var(--c-con)"></i>conversation</span><span><i style="color:var(--c-fil)"></i>fichier</span><span><i style="color:var(--c-img)"></i>image</span>
</div>
<div id="side" class="glass"></div>
<div id="tip" class="glass"></div>
<div id="empty"><div style="font-size:19px;font-weight:600;color:var(--tx)">Cerveau vide</div>Ajoute un souvenir, dépose un fichier, ou lance <code>kjui demo</code></div>
<div id="drop">Dépose tes fichiers, images, PDF… pour les mémoriser</div>
<div id="toast" class="glass"></div>
<div id="modal"><div class="box glass">
  <h3 style="margin:0 0 14px;font-size:18px">Nouveau souvenir</h3>
  <label>Titre<input id="m-title" placeholder="ex. Stack du projet"></label>
  <label>Contenu<textarea id="m-content" placeholder="Un fait court, autonome et durable…"></textarea></label>
  <label>Type<select id="m-kind"><option value="memory">souvenir</option><option value="instruction">instruction</option><option value="file">fichier</option></select></label>
  <label>Tags<input id="m-tags" placeholder="python tests ci"></label>
  <label class="switch" style="margin-bottom:16px"><input type="checkbox" id="m-pin"><b></b><span>toujours inclure (épinglé)</span></label>
  <div class="row" style="justify-content:flex-end"><button class="btn warn" id="m-cancel">Annuler</button><button class="btn dark" id="m-save">Mémoriser</button></div>
</div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const KC={memory:[0,150,230],instruction:[255,150,30],conversation:[140,90,240],file:[30,190,120],image:[240,80,140]};
const KN={memory:'souvenir',instruction:'instruction',conversation:'conversation',file:'fichier',image:'image'};
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const fmt=n=>Number(n).toLocaleString('fr-FR');

/* ---------- géométrie du cerveau (déterministe : les N premiers points ne changent jamais) ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dir(r){let x,y,z,l;do{x=r()*2-1;y=r()*2-1;z=r()*2-1;l=x*x+y*y+z*z}while(l>1||l<.05);l=Math.sqrt(l);return[x/l,y/l,z/l]}
const gyri=(x,y,z)=>Math.sin(x*9+Math.sin(z*7))*.5+Math.sin(y*8+z*6+x*3)*.3+Math.sin(z*11-x*5)*.2;
function samplePoint(r){
  const t=r();
  if(t<.10){const d=dir(r),s=r()<.8?1:.6+.4*r(),w=1+.06*Math.sin(d[1]*34);
    return[d[0]*.27*s*w,-.37+d[1]*.15*s*w,-.52+d[2]*.17*s*w]}
  if(t<.16){const a=r()*6.283,q=r(),rad=.055*(r()<.8?1:r());
    return[Math.cos(a)*rad,-.3-q*.42,-.3-q*.14+Math.sin(a)*rad]}
  for(;;){
    const side=r()<.5?-1:1,d=dir(r),sh=r()<.8?1:.5+.45*r(),g=1+.075*gyri(d[0],d[1],d[2]);
    let x=side*.2+d[0]*.37*sh*g,y=.06+d[1]*.42*sh*g,z=.02+d[2]*.64*sh*g;
    if(y<-.13)y=-.13+(y+.13)*.5;
    if(x*side<.018)continue;
    return[x,y,z];
  }
}
let pos=new Float32Array(0),S=0;
function ensureSlots(n){
  if(n<=S)return;const N=Math.max(n,4200),r=mulberry(7),p=new Float32Array(N*3);
  for(let i=0;i<N;i++){const v=samplePoint(r);p[i*3]=v[0];p[i*3+1]=v[1];p[i*3+2]=v[2]}
  pos=p;S=N;buildMesh();
}

/* ---------- état ---------- */
let nodes=[],slotOf=new Map(),nextSlot=0,used=new Uint8Array(0),edges=[],mesh=[];
let byId=new Map(),version='',active=new Map(),beams=[],pulses=[],rings=[];
let hover=null,selected=null;
const now=()=>performance.now()/1000;

function buildMesh(){
  const r=mulberry(99),cell=.075,g=new Map();mesh=[];
  for(let i=0;i<S;i++){const k=Math.floor(pos[i*3]/cell)+','+Math.floor(pos[i*3+1]/cell)+','+Math.floor(pos[i*3+2]/cell);(g.get(k)||g.set(k,[]).get(k)).push(i)}
  for(const arr of g.values()){if(arr.length<2||r()>.5)continue;const a=arr[0|r()*arr.length],b=arr[0|r()*arr.length];if(a!==b)mesh.push([a,b])}
}
function buildEdges(){
  used=new Uint8Array(S);edges=[];const cell=.2,g=new Map(),list=[];
  for(const n of nodes){const s=slotOf.get(n.id);used[s]=1;list.push([n,s]);
    const k=Math.floor(pos[s*3]/cell)+','+Math.floor(pos[s*3+1]/cell)+','+Math.floor(pos[s*3+2]/cell);(g.get(k)||g.set(k,[]).get(k)).push(s)}
  const seen=new Set();
  for(const [n,s] of list){
    const cx=Math.floor(pos[s*3]/cell),cy=Math.floor(pos[s*3+1]/cell),cz=Math.floor(pos[s*3+2]/cell),c=[];
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){const a=g.get((cx+x)+','+(cy+y)+','+(cz+z));if(a)for(const o of a)if(o!==s)c.push(o)}
    const d=o=>{const dx=pos[o*3]-pos[s*3],dy=pos[o*3+1]-pos[s*3+1],dz=pos[o*3+2]-pos[s*3+2];return dx*dx+dy*dy+dz*dz};
    c.sort((a,b)=>d(a)-d(b));
    for(const o of c.slice(0,2)){const k=s<o?s+'-'+o:o+'-'+s;if(!seen.has(k)&&d(o)<.05){seen.add(k);edges.push([s,o])}}
    if(edges.length>5000)break;
  }
}

function setGraph(data,animate){
  const fresh=[];
  for(const n of data.nodes){
    if(!slotOf.has(n.id)){slotOf.set(n.id,nextSlot++);if(animate)fresh.push(n.id)}
  }
  ensureSlots(nextSlot+3000);
  const old=byId;byId=new Map();
  nodes=data.nodes;for(const n of nodes){const o=old.get(n.id);n.birth=o?o.birth:(animate?now():-9);byId.set(n.id,n)}
  buildEdges();updateStats(data.stats);version=data.stats.version;
  $('#empty').style.display=nodes.length?'none':'block';
  for(const id of fresh){const n=byId.get(id);rings.push({slot:slotOf.get(id),t:now(),col:KC[n.kind]||KC.memory});}
}
function updateStats(s){
  $('#s-n').textContent=fmt(s.memories);$('#s-t').textContent=fmt(s.stored_tokens);
  $('#s-r').textContent=fmt(s.recalls);$('#s-s').textContent=fmt(s.saved_tokens);
  const tot=s.saved_tokens+s.served_tokens;$('#s-bar').style.width=(tot?Math.round(100*s.saved_tokens/tot):0)+'%';
}
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
async function load(animate){setGraph(await api('/api/graph'),animate)}
setInterval(async()=>{try{const s=await api('/api/stats');if(s.version!==version)await load(true);else updateStats(s)}catch(e){}},2500);

/* ---------- rendu ---------- */
const cv=$('#c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();
const beads={},glows={};
function bead(c){const k=c.join();if(beads[k])return beads[k];
  const o=document.createElement('canvas');o.width=o.height=128;const x=o.getContext('2d');
  let g=x.createRadialGradient(64,88,4,64,88,42);g.addColorStop(0,'rgba(40,60,100,.30)');g.addColorStop(1,'rgba(40,60,100,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const lt=c.map(v=>Math.min(255,v+95)),dk=c.map(v=>Math.round(v*.6));
  g=x.createRadialGradient(50,44,3,64,64,40);
  g.addColorStop(0,'rgba(255,255,255,.96)');g.addColorStop(.22,rgb(lt,.93));g.addColorStop(.68,rgb(c,.93));g.addColorStop(1,rgb(dk,.96));
  x.fillStyle=g;x.beginPath();x.arc(64,64,40,0,6.283);x.fill();
  x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=2.5;x.beginPath();x.arc(64,64,37.5,Math.PI*1.05,Math.PI*1.6);x.stroke();
  x.strokeStyle=rgb(lt,.55);x.lineWidth=2;x.beginPath();x.arc(64,64,37.5,Math.PI*.1,Math.PI*.55);x.stroke();
  x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.ellipse(50,45,11,6,-.6,0,6.283);x.fill();
  return beads[k]=o}
function glow(c){const k=c.join();if(glows[k])return glows[k];const o=document.createElement('canvas');o.width=o.height=64;const x=o.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,rgb(c,.75));g.addColorStop(.35,rgb(c,.28));g.addColorStop(1,rgb(c,0));
  x.fillStyle=g;x.fillRect(0,0,64,64);return glows[k]=o}
let yaw=.6,pitch=.12,zoom=1,vyaw=.0018,drag=null,lastInteract=0;
let PX=new Float32Array(0),PY=new Float32Array(0),PZ=new Float32Array(0),PS=new Float32Array(0);
function project(t){
  if(PX.length<S){PX=new Float32Array(S);PY=new Float32Array(S);PZ=new Float32Array(S);PS=new Float32Array(S)}
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const sideOpen=$('#side').classList.contains('open')&&W>900;
  const cx=W*(sideOpen?.4:.5),cyy=H*.5,sc=Math.min(W*(sideOpen?.8:1),H)*.62*zoom*(1+.012*Math.sin(t*1.3));
  for(let i=0;i<S;i++){
    const x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2];
    const x1=x*cy-z*sy,z1=x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp;
    const s=3.2/(3.2-z2);PX[i]=cx+x1*s*sc;PY[i]=cyy-y2*s*sc;PZ[i]=z2;PS[i]=s;
  }
}
function drawLines(list,style,w){
  ctx.strokeStyle=style;ctx.lineWidth=w;ctx.beginPath();
  for(const [a,b] of list){ctx.moveTo(PX[a],PY[a]);ctx.lineTo(PX[b],PY[b])}ctx.stroke();
}
function frame(){
  const t=now();
  if(!drag&&t-lastInteract>2.5)yaw+=vyaw;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(!S){requestAnimationFrame(frame);return}
  project(t);
  const focusOn=active.size>0;
  drawLines(mesh,`rgba(80,110,170,${focusOn?.05:.09})`,.6);
  const wave=Math.sin(t*.5)*.75;const bk=[[],[],[],[],[]];
  for(let i=0;i<S;i++){if(used[i])continue;const z=PZ[i];
    let b=z<-.35?0:z<0?1:z<.35?2:3;if(Math.abs(z-wave)<.045)b=4;bk[b].push(i)}
  const alpha=[.2,.32,.48,.68,.95],size=[1.2,1.5,1.9,2.3,2.8],col=['110,135,185','95,120,175','80,105,165','65,90,155','10,120,255'];
  for(let b=0;b<5;b++){ctx.fillStyle=`rgba(${col[b]},${alpha[b]*(focusOn?.5:1)})`;ctx.beginPath();
    for(const i of bk[b]){const s=size[b]*PS[i];ctx.rect(PX[i]-s/2,PY[i]-s/2,s,s)}ctx.fill()}
  drawLines(edges,`rgba(60,110,190,${focusOn?.14:.26})`,.9);
  if(pulses.length<90&&edges.length&&Math.random()<.55){const e=edges[0|Math.random()*edges.length];
    const n=nodeAtSlot(e[0]);pulses.push({e,t:0,v:.5+Math.random()*.9,c:n?KC[n.kind]:KC.memory})}
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=p.v/60;if(p.t>=1){pulses.splice(i,1);continue}
    const a=p.e[0],b=p.e[1],x=PX[a]+(PX[b]-PX[a])*p.t,y=PY[a]+(PY[b]-PY[a])*p.t,r=8*PS[a];
    ctx.globalAlpha=Math.sin(p.t*Math.PI);ctx.drawImage(glow(p.c),x-r,y-r,r*2,r*2)}
  ctx.globalAlpha=1;
  for(let i=beams.length-1;i>=0;i--){const b=beams[i],age=t-b.t0;if(age>4){beams.splice(i,1);continue}
    const k=Math.min(1,age/.7),a=b.a,c=b.b,x=PX[a]+(PX[c]-PX[a])*k,y=PY[a]+(PY[c]-PY[a])*k;
    const fade=age<2.5?1:Math.max(0,1-(age-2.5)/1.5);
    const g=ctx.createLinearGradient(PX[a],PY[a],x,y);g.addColorStop(0,'rgba(255,170,20,0)');g.addColorStop(1,`rgba(255,160,10,${.9*fade})`);
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PX[a],PY[a]);ctx.lineTo(x,y);ctx.stroke()}
  const heavy=nodes.length>2500,order=nodes.map(n=>[n,slotOf.get(n.id)]);
  if(!heavy)order.sort((p,q)=>PZ[p[1]]-PZ[q[1]]);
  const recent=nodes.length?nodes[Math.max(0,nodes.length-1200)].id:0;
  const GOLD=[255,176,20];
  for(const [n,s] of order){
    if(heavy&&n.id<recent&&!active.has(n.id)&&selected!==n.id&&hover!==n.id){const c=KC[n.kind]||KC.memory,z=Math.max(1.8,2.6*PS[s]);
      ctx.fillStyle=rgb(c,focusOn?.25:.8);ctx.fillRect(PX[s]-z/2,PY[s]-z/2,z,z);continue}
    const col=KC[n.kind]||KC.memory,act=active.get(n.id),isSel=selected===n.id,isHov=hover===n.id;
    const depth=.6+.4*((PZ[s]+.75)/1.5);
    let base=(3.2+Math.min(3,Math.log1p(n.hits)*.9)+(n.pinned?1.6:0))*PS[s];
    const age=t-n.birth;if(age<1.2)base*=1+2.2*Math.exp(-age*3.2)*Math.cos(age*8);
    const al=focusOn?(act?1:.3):depth;
    const r=base*(1+.12*Math.sin(t*2.2+s))*(act?1.45+.2*Math.sin(t*6):1)*(isHov||isSel?1.45:1);
    if(act){const G=r*7;ctx.globalAlpha=.55;ctx.drawImage(glow(GOLD),PX[s]-G,PY[s]-G,G*2,G*2)}
    const Hh=r*2.7;ctx.globalAlpha=Math.min(1,al);ctx.drawImage(bead(act?GOLD:col),PX[s]-Hh,PY[s]-Hh,Hh*2,Hh*2);
    ctx.globalAlpha=1;
    if(act||isSel){ctx.strokeStyle=act?'rgba(230,140,0,.75)':'rgba(26,33,51,.75)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(PX[s],PY[s],r*2.5+2*Math.sin(t*4),0,6.283);ctx.stroke()}
  }
  for(let i=rings.length-1;i>=0;i--){const g=rings[i],age=t-g.t;if(age>2){rings.splice(i,1);continue}
    ctx.strokeStyle=rgb(g.col,1-age/2);ctx.lineWidth=2;ctx.beginPath();ctx.arc(PX[g.slot],PY[g.slot],age*70*PS[g.slot],0,6.283);ctx.stroke()}
  requestAnimationFrame(frame);
}
const slotNode=new Map();let slotVer=-1;
function nodeAtSlot(s){if(slotVer!==nodes){slotNode.clear();for(const n of nodes)slotNode.set(slotOf.get(n.id),n);slotVer=nodes}return slotNode.get(s)}

/* ---------- interactions ---------- */
function pick(mx,my){
  let best=null,bd=16*16;
  for(const n of nodes){const s=slotOf.get(n.id),dx=PX[s]-mx,dy=PY[s]-my,d=dx*dx+dy*dy;if(d<bd){bd=d;best=n.id}}
  return best;
}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};cv.classList.add('drag');cv.setPointerCapture(e.pointerId);lastInteract=now()});
cv.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    yaw+=dx*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*.005));drag.x=e.clientX;drag.y=e.clientY;lastInteract=now();return}
  hover=S?pick(e.clientX,e.clientY):null;cv.classList.toggle('hov',hover!==null);
  const tip=$('#tip');if(hover!==null){const n=byId.get(hover);tip.textContent=n.title+' · '+fmt(n.tokens)+' tokens';
    tip.style.left=Math.min(e.clientX+14,W-300)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1}else tip.style.opacity=0});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');const was=drag;drag=null;
  if(was&&!was.moved){const id=pick(e.clientX,e.clientY);if(id!==null)openMemory(id);else closeSide()}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(e.deltaY<0?1.08:.93)));lastInteract=now()},{passive:false});

function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2600)}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}
  for(const c of kids)e.append(c);return e}
function closeSide(){$('#side').classList.remove('open');selected=null}
async function openMemory(id){
  const m=await api('/api/memory/'+id);selected=id;const side=$('#side');side.replaceChildren();
  const col=KC[m.kind]||KC.memory;
  side.append(el('h2',{},m.title||'(sans titre)'),
    el('div',{class:'meta'},
      el('span',{class:'badge',style:`color:${rgb(col)};border-color:${rgb(col,.5)}`},KN[m.kind]||m.kind),
      el('span',{class:'badge'},'#'+m.id),el('span',{class:'badge'},fmt(m.tokens)+' tokens'),el('span',{class:'badge'},m.hits+' rappels'),
      ...(m.pinned?[el('span',{class:'badge'},'📌 épinglé')]:[]),...(m.tags?m.tags.split(' ').map(t=>el('span',{class:'badge'},'#'+t)):[])),
    ...(m.blob&&/^image\/(png|jpeg|gif|webp)$/.test(m.mime)?[el('img',{src:'/files/'+m.blob,style:'max-width:100%;border-radius:10px;border:1px solid var(--line)'})]:[]),
    ...(m.blob?[el('a',{class:'btn',href:'/files/'+m.blob,target:'_blank',download:m.title,style:'display:inline-block;text-decoration:none;margin:6px 0'},'⬇ Ouvrir / télécharger le fichier')]:[]),
    el('pre',{},m.content),
    el('div',{class:'meta'},el('span',{class:'badge'},'source : '+(m.source||'—').slice(-60))),
    el('div',{class:'row'},
      el('button',{class:'btn',onclick:async()=>{await api('/api/pin/'+id,{method:'POST',body:JSON.stringify({pinned:!m.pinned})});await load(false);openMemory(id)}},m.pinned?'Désépingler':'📌 Épingler'),
      el('button',{class:'btn',onclick:()=>{navigator.clipboard?.writeText(m.content);toast('Copié')}},'Copier'),
      el('button',{class:'btn warn',onclick:async()=>{if(!confirm('Oublier ce souvenir ?'))return;await api('/api/memory/'+id,{method:'DELETE'});closeSide();await load(false)}},'Oublier'),
      el('button',{class:'btn',onclick:closeSide},'Fermer')));
  side.classList.add('open');
}

/* recherche : aperçu live (sans compter) + rappel complet à Entrée */
let st;const qi=$('#q');
function lightUp(ids){
  active=new Map(ids.map(i=>[i,1]));beams=[];const t=now();
  const slots=ids.map(i=>slotOf.get(i)).filter(s=>s!==undefined);
  slots.forEach((s,i)=>beams.push({a:i?slots[i-1]:slots[0],b:s,t0:t+i*.12}));
}
qi.addEventListener('input',()=>{clearTimeout(st);const v=qi.value.trim();
  if(!v){active=new Map();beams=[];return}
  st=setTimeout(async()=>{const r=await api('/api/search?q='+encodeURIComponent(v));lightUp(r.map(x=>x.id))},220)});
qi.addEventListener('keydown',async e=>{
  if(e.key==='Escape'){qi.value='';active=new Map();beams=[];return}
  if(e.key!=='Enter'||!qi.value.trim())return;
  const r=await api('/api/recall?q='+encodeURIComponent(qi.value.trim()));updateStats(r.stats);
  lightUp(r.matches);const side=$('#side');side.replaceChildren();selected=null;
  side.append(el('h2',{},'Rappel : '+r.ids.length+' souvenir(s)'),
    el('div',{class:'meta'},el('span',{class:'badge'},'≈'+fmt(r.tokens)+' tokens servis'),el('span',{class:'badge',style:'color:var(--ok)'},'≈'+fmt(r.saved)+' économisés')),
    ...r.ids.map(id=>{const n=byId.get(id);return el('div',{class:'res',onclick:()=>openMemory(id)},el('span',{class:'dot',style:`color:${rgb(KC[n?.kind]||KC.memory)}`}),n?n.title:'#'+id)}),
    el('pre',{},r.pack||'(aucun souvenir pertinent)'),
    el('div',{class:'row'},el('button',{class:'btn',onclick:()=>{navigator.clipboard?.writeText(r.pack);toast('Contexte copié — colle-le dans Claude')}},'Copier le contexte'),el('button',{class:'btn',onclick:closeSide},'Fermer')));
  side.classList.add('open');
});

/* ajout / import */
const modal=$('#modal');
$('#add').onclick=()=>{modal.classList.add('open');$('#m-content').focus()};
$('#m-cancel').onclick=()=>modal.classList.remove('open');
$('#m-save').onclick=async()=>{const c=$('#m-content').value.trim();if(!c)return;
  await api('/api/remember',{method:'POST',body:JSON.stringify({title:$('#m-title').value,content:c,kind:$('#m-kind').value,tags:$('#m-tags').value,pinned:$('#m-pin').checked})});
  for(const i of['#m-title','#m-content','#m-tags'])$(i).value='';modal.classList.remove('open');await load(true);toast('Souvenir mémorisé')};
const TXT=/\.(md|markdown|txt|py|js|ts|tsx|jsx|json|csv|tsv|html|css|ya?ml|toml|xml|sh|bat|log|ini|cfg|sql|java|c|h|cpp|cs|go|rs|rb|php|swift|kt|lua|rst)$/i;
const b64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]||'');r.onerror=ko;r.readAsDataURL(f)});
async function upload(files){
  let chunks=0;const instr=$('#asInstr').checked;
  for(const f of files){
    const body={name:f.name,kind:instr?'instruction':undefined,pinned:instr};
    if(TXT.test(f.name))body.text=await f.text();else body.b64=await b64(f);
    try{chunks+=(await api('/api/upload',{method:'POST',body:JSON.stringify(body)})).chunks}catch(e){toast('Échec : '+f.name+' ('+e.message+')')}
  }
  await load(true);toast(files.length+' fichier(s) mémorisé(s) ('+chunks+' blocs)');
}
$('#file').onchange=e=>{upload([...e.target.files]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();$('#drop').style.display='flex'});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').style.display='none'});
addEventListener('drop',e=>{e.preventDefault();$('#drop').style.display='none';upload([...e.dataTransfer.files])});

load(false).then(()=>requestAnimationFrame(frame));
</script>
